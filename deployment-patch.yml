      registryPath: /opt/komodo-control/.migration-private/weknora-pilot-komodo-control.registry.v1.json
      manifestPath: /opt/komodo-control/.migration-private/weknora-pilot-komodo-control.keys.v3.json
      lifecyclePath: /opt/komodo-control/.migration-private/weknora-pilot-komodo-control.lifecycle.v1.json
      queuePath: /opt/komodo-control/.migration-private/weknora-pilot-queue.json
