- id: dsh-memory-gateway
  config:
    gateway:
      enabled: true
      recall: true
      ingest: true
      includeGlobal: true
      topK: 8
      threshold: 0.25
      recallMaxChars: 1400
      recallTimeoutMs: 30000
      recallJoinMs: 1500
      ingestTimeoutMs: 120000
      fallbackProjectId: personal-workspace
      ingestBatchSize: 8
      ingestFlushMs: 5000
      maxMessageChars: 1800
      gatewayUrl: http://127.0.0.1:8892
      projectConfigName: .agent-memory/project.json
      projectRootPrefix: /opt
      memoryApiKeyDir: /opt/agent-runtime/gateway-keys
      memoryApiKeyFile: /opt/agent-memory/GATEWAY_API_KEY.txt
      memoryApiKeyEnv: AGENT_MEMORY_API_KEY
      apiKeyFile: /opt/agent-memory/GATEWAY_API_KEY.txt
